name: Release binaries

# Builds release archives for an existing tag and uploads them, with
# checksums.txt, to an existing DRAFT release. It never publishes a release;
# a maintainer reviews the draft and publishes it by hand (see RELEASING.md).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing pushed tag (vMAJOR.MINOR.PATCH) with a draft release, on a commit already merged to main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Validate tag name
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag must look like v1.2.3 or v1.2.3-rc.1."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Require a pushed tag merged to main
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          if ! git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} does not exist. Push the tag before creating the draft release (see RELEASING.md)."
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${TAG}^{commit}" origin/main; then
            echo "Tag ${TAG} is not on main."
            exit 1
          fi
      - name: Check out the tagged commit
        id: resolve
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          sha="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          git checkout --detach "$sha"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Require Cargo.toml version to match the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          version="$(cargo metadata --no-deps --format-version 1 --locked | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "v${version}" != "$TAG" ]; then
            echo "Cargo.toml version ${version} does not match tag ${TAG}."
            exit 1
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # Draft releases are only visible to tokens with write access, so this check
  # runs in its own job that does not check out or execute repository code.
  require-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require a draft release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          is_draft="$(gh release view "$TAG" --repo "$GH_REPO" --json isDraft --jq .isDraft || true)"
          if [ "$is_draft" != "true" ]; then
            echo "Create a draft release for ${TAG} first (see RELEASING.md)."
            exit 1
          fi

  build:
    needs: [validate, require-draft]
    uses: ./.github/workflows/build-binaries.yml
    with:
      # Build exactly the commit that was validated, even if the tag moves.
      ref: ${{ needs.validate.outputs.sha }}
      label: ${{ inputs.tag }}

  upload:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sbom-release-diff-${{ inputs.tag }}
          path: dist
      - name: Verify checksums and upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          VALIDATED_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -eu
          cd dist
          sha256sum --check --strict checksums.txt
          tag_sha="$(gh api "repos/${GH_REPO}/commits/${TAG}" --jq .sha)"
          if [ "$tag_sha" != "$VALIDATED_SHA" ]; then
            echo "Tag ${TAG} moved during the run (${VALIDATED_SHA} -> ${tag_sha}); refusing to upload."
            exit 1
          fi
          is_draft="$(gh release view "$TAG" --repo "$GH_REPO" --json isDraft --jq .isDraft)"
          if [ "$is_draft" != "true" ]; then
            echo "Refusing to upload assets to a published release."
            exit 1
          fi
          gh release upload "$TAG" --repo "$GH_REPO" --clobber *.tar.gz *.zip checksums.txt
