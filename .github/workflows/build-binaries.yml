name: Build binaries

# Reusable workflow: builds release archives for each platform and a
# checksums.txt, and uploads them as workflow artifacts. It never creates or
# changes a GitHub release.

on:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch or tag to build
        required: true
        type: string
      label:
        description: Version label used in archive names (a tag such as v0.1.0, or a commit SHA)
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'linux-musl')
        name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          LABEL: ${{ inputs.label }}
        run: |
          set -eu
          if ! printf '%s' "$LABEL" | grep -Eq '^[0-9A-Za-z.+-]{1,64}$'; then
            echo "Unexpected label."
            exit 1
          fi
          name="sbom-release-diff_${LABEL}_${TARGET}"
          staging="dist/${name}"
          mkdir -p "$staging"
          binary="sbom-release-diff"
          case "$TARGET" in *windows*) binary="${binary}.exe" ;; esac
          cp "target/${TARGET}/release/${binary}" "$staging/"
          cp LICENSE NOTICE README.md CHANGELOG.md "$staging/"
          python3 scripts/third_party_licenses.py "$staging/THIRD-PARTY-LICENSES.txt" \
            || python scripts/third_party_licenses.py "$staging/THIRD-PARTY-LICENSES.txt"
          case "$TARGET" in
            *windows*)
              # Python's zipfile writes portable '/' separators.
              (cd dist && { python3 -m zipfile -c "${name}.zip" "${name}/" || python -m zipfile -c "${name}.zip" "${name}/"; })
              ;;
            *) tar -C dist -czf "dist/${name}.tar.gz" "${name}" ;;
          esac
          rm -rf "$staging"
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: build-*
          merge-multiple: true
      - name: Create checksums.txt
        run: |
          set -eu
          cd dist
          sha256sum *.tar.gz *.zip | sort -k2 > checksums.txt
          cat checksums.txt
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-release-diff-${{ inputs.label }}
          path: dist/*
          if-no-files-found: error
